# PEGASUS Fine-tuning Configuration
# google/pegasus-pubmed on ccdv/pubmed-summarization

model:
    name: "google/pegasus-pubmed"
    max_input_tokens: 1024
    max_output_tokens: 256

data:
    dataset_id: "ccdv/pubmed-summarization"   # fixed: was ccdv/pubmed
    input_field: "article"
    target_field: "abstract"

training:
    seed: 42
    epochs: 3
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2   # effective batch size = 8
    per_device_eval_batch_size: 4
    optimizer: "adamw_torch"
    learning_rate: 3.0e-5
    lr_scheduler_type: "linear"
    warmup_steps: 500
    weight_decay: 0.01
    fp16: true
    evaluation_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"

output:
    output_dir: "outputs/pegasus_finetuned"
    logging_dir: "outputs/pegasus_logs"

wandb:
    project: "research-summarizer"
    run_name: "pegasus-pubmed-finetune"
