[project]
name = "research-summarizer"
version = "1.0.0"
description = "Domain-Adaptive Multi-Model Research Paper Summarization System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Deep learning core
    "torch==2.5.1",
    "accelerate==0.34.2",
    "datasets==2.20.0",
    "tokenizers==0.20.3",
    # NLP preprocessing
    "spacy==3.8.4",
    "nltk==3.9.1",
    "keybert==0.8.5",
    "yake==0.4.8",
    # PDF parsing
    "pymupdf==1.24.10",
    # Agent orchestration
    "langchain==0.3.3",
    "langchain-community==0.3.2",
    # Evaluation metrics
    "rouge-score==0.1.2",
    "bert-score==0.3.13",
    "scikit-learn==1.5.2",
    # Experiment tracking
    "wandb==0.18.3",
    # Notebooks
    "jupyter==1.1.1",
    "ipykernel==6.29.5",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "pandas==2.2.3",
    # Utilities
    "numpy==1.26.4",
    "tqdm==4.66.5",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "transformers==4.46.3",
    "peft==0.13.2",
    "sentence-transformers==3.1.1",
    "pip>=26.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
