[project]
name = "research-summarizer"
version = "1.0.0"
description = "Domain-Adaptive Multi-Model Research Paper Summarization System"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Deep learning core
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    # Efficient fine-tuning (optional LoRA support)
    "peft>=0.10.0",
    # NLP preprocessing
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "keybert>=0.8.0",
    "yake>=0.4.8",
    # PDF parsing
    "pymupdf>=1.24.0",
    # Agent orchestration
    "langchain>=0.1.0",
    "langchain-community>=0.0.30",
    # Evaluation metrics
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "scikit-learn>=1.4.0",
    # Experiment tracking
    "wandb>=0.16.0",
    # Keyword extraction
    "sentence-transformers>=2.7.0",
    # Notebooks
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    # Utilities
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
